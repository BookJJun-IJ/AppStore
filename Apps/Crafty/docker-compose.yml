name: crafty

services:
  crafty:
    image: ghcr.io/yundera/nginx-hash-lock:1.0.7
    container_name: crafty
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 80
    deploy:
      resources:
        limits:
          memory: 128M
    expose:
      - "80"
    labels:
      caddy_0: crafty-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: crafty-\${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: crafty-\${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      BACKEND_HOST: crafty-relay
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
    depends_on:
      - crafty-relay
    networks:
      - pcs

  crafty-relay:
    image: nginx:1.27-alpine
    container_name: crafty-relay
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 80
    deploy:
      resources:
        limits:
          memory: 32M
    expose:
      - "80"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/nginx.conf << 'EOF'
        events {}
        http {
          server {
            listen 80;
            location / {
              proxy_pass https://crafty-backend:8443;
              proxy_ssl_verify off;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
            }
          }
        }
        EOF
        nginx -g "daemon off;"
    depends_on:
      - crafty-backend
    networks:
      - pcs

  crafty-backend:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.10.3
    container_name: crafty-backend
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 50
    expose:
      - "8443"
    ports:
      - "25500-25600:25500-25600"      # Minecraft Java server port pool
      - "19132:19132/udp"              # Minecraft Bedrock
      - "8123:8123"                    # Dynmap
    environment:
      TZ: $TZ
    volumes:
      - /DATA/AppData/$AppID/backups/:/crafty/backups
      - /DATA/AppData/$AppID/logs/:/crafty/logs
      - /DATA/AppData/$AppID/servers/:/crafty/servers
      - /DATA/AppData/$AppID/config/:/crafty/app/config
      - /DATA/AppData/$AppID/import/:/crafty/import
    networks:
      - pcs

networks:
  pcs:
    name: pcs
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: crafty
  store_app_id: crafty
  webui_port: 80
  index: /
  author: Yundera Team
  developer: Arcadia Technology
  category: Games
  icon: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Crafty/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Crafty/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Crafty/screenshot-1.png
  title:
    en_us: Crafty Controller
  tagline:
    en_us: Web-based Minecraft server manager.
    fr_fr: Gestionnaire de serveurs Minecraft en ligne.
    ko_kr: 웹 기반 마인크래프트 서버 관리자.
    es_es: Gestor de servidores de Minecraft basado en web.
  description:
    en_us: |
      Crafty Controller is a web GUI for creating, running and managing
      Minecraft servers (Java and Bedrock) from your browser. It launches and
      supervises your server processes, automates backups, builds servers from
      common loaders, gives you live console access, and supports per-user
      roles and permissions.
    fr_fr: |
      Crafty Controller est une interface web pour creer, lancer et gerer des
      serveurs Minecraft (Java et Bedrock) depuis votre navigateur. Il lance et
      supervise les processus serveur, automatise les sauvegardes, cree des
      serveurs a partir des loaders courants, donne acces a la console en direct
      et gere les roles et permissions par utilisateur.
    ko_kr: |
      Crafty Controller는 브라우저에서 마인크래프트 서버(자바 및 베드락)를
      생성, 실행, 관리할 수 있는 웹 GUI입니다. 서버 프로세스 실행 및 관리,
      백업 자동화, 일반 로더 기반 서버 생성, 실시간 콘솔 접근, 사용자별 역할
      및 권한을 지원합니다.
    es_es: |
      Crafty Controller es una interfaz web para crear, ejecutar y gestionar
      servidores de Minecraft (Java y Bedrock) desde tu navegador. Lanza y
      supervisa los procesos del servidor, automatiza las copias de seguridad,
      crea servidores a partir de loaders comunes, da acceso a la consola en
      vivo y admite roles y permisos por usuario.
  tips:
    before_install:
      en_us: |
        After the SSO login, Crafty will prompt you for its own credentials.

        Crafty generates its own admin password on first boot.
        Find it in the Files app at:
        `AppData/crafty/config/default-creds.txt`

        **Minecraft server ports:**
        Servers you create must use a port in the **25500–25600** range.
        Bedrock servers use **UDP 19132**.
